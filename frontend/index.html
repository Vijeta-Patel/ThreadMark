<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreadMark - Garment Intake Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <div class="container">
        <header class="header">
            <h1>ThreadMark</h1>
            <p>Digital Product Passport Intake</p>
        </header>

        <main class="form-wrapper">
            <form id="garmentForm" class="glass-form">
                <div class="form-header">
                    <h2>Register Garment</h2>
                    <p>Enter the details to generate a digital identity.</p>
                </div>

                <div class="form-group">
                    <label for="brand_name">Brand Name</label>
                    <input type="text" id="brand_name" name="brand_name" required placeholder="e.g. Acme Apparel">
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="material">Material</label>
                        <input type="text" id="material" name="material" required placeholder="e.g. 100% Organic Cotton">
                    </div>

                    <div class="form-group half">
                        <label for="size">Size</label>
                        <select id="size" name="size" required>
                            <option value="" disabled selected>Select size</option>
                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                            <option value="One Size">One Size</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="color">Color</label>
                        <input type="text" id="color" name="color" required placeholder="e.g. Midnight Blue">
                    </div>

                    <div class="form-group half">
                        <label for="price">Price (USD)</label>
                        <input type="number" id="price" name="price" step="0.01" min="0" required placeholder="0.00">
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Register Garment</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
